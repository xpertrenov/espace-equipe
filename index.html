<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace Équipe Xpert'Renov</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5a3d22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Espace Équipe">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Tableau d'affichage de dépôt : bandeau brun, onglets, cartes sobres ; or du logo pour l'accent */
:root {
  --bg: #eceae6; --surface: #ffffff; --surface-2: #f5f3ef; --ink: #2a211a; --muted: #6d645b; --line: #d9d3ca;
  --brand: #5a3d22; --on-brand: #fbf6ee; --gold: #b8893a; --gold-ink: #8a6420;
  --ok: #2d7a4c; --ok-bg: #e5f2ea; --ko: #b3261e; --ko-bg: #fbe9e7; --warn: #9a5b00; --warn-bg: #fdf1dc;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif; --f-body: "Barlow", "Segoe UI", system-ui, sans-serif; --f-mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #15120f; --surface: #211c17; --surface-2: #2a241e; --ink: #f0e9df; --muted: #b3a797; --line: #3b332b;
  --brand: #3a2818; --on-brand: #f6ead8; --gold: #d9a957; --gold-ink: #e8bd6c;
  --ok: #7fd3a0; --ok-bg: #1d3327; --ko: #ff8a7f; --ko-bg: #3a201d; --warn: #f0b860; --warn-bg: #3a2c16; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: .01em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }
.inner { max-width: 1100px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }

/* Connexion */
#login, #pwd { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.loginbox { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.loginbox .top { background: var(--brand); color: var(--on-brand); padding: 20px; display: flex; gap: 14px; align-items: center; }
.loginbox .top img { width: 64px; height: 64px; background: #fff; border-radius: 8px; padding: 4px; object-fit: contain; }
.loginbox h1 { font-size: 30px; line-height: .95; text-transform: uppercase; }
.loginbox form { padding: 20px; display: grid; gap: 12px; }
.f { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.f input, .f select, .f textarea { font-size: 16px; font-weight: 500; color: var(--ink); background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 7px; padding: 10px 11px; width: 100%; min-width: 0; }
.f textarea { min-height: 80px; resize: vertical; }
.f input:focus, .f select:focus, .f textarea:focus { border-color: var(--gold); outline: none; }
.err { color: var(--ko); font-weight: 600; font-size: 14px; min-height: 1.2em; }
.okmsg { color: var(--ok); font-weight: 600; font-size: 14px; }

/* Boutons */
.btn { border: 0; border-radius: 7px; padding: 10px 16px; font: 700 15px var(--f-display); letter-spacing: .07em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.btn.primary { background: var(--brand); color: var(--on-brand); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
.btn.danger { background: transparent; border: 1.5px solid var(--ko); color: var(--ko); }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Coquille */
header.bar { background: var(--brand); color: var(--on-brand); position: sticky; top: 0; z-index: 20; }
header.bar .inner { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
header.bar img { width: 40px; height: 40px; background: #fff; border-radius: 6px; padding: 3px; object-fit: contain; }
header.bar .ttl { font: 800 22px/1 var(--f-display); text-transform: uppercase; flex: 1; min-width: 0; }
header.bar .who { font-size: 14px; opacity: .9; text-align: right; }
header.bar .who b { display: block; }
header.bar button { background: transparent; border: 1.5px solid color-mix(in srgb, var(--on-brand) 40%, transparent); color: var(--on-brand); border-radius: 6px; padding: 5px 10px; font-size: 13px; font-weight: 600; }
nav.tabs { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 60px; z-index: 19; }
nav.tabs .inner { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { flex: none; border: 0; background: transparent; padding: 13px 14px 11px; border-bottom: 3px solid transparent; font: 700 15px var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
main { padding-block: 20px 50px; }
.view { display: grid; gap: 18px; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--gold); padding-bottom: 6px; }
.head h2 { font-size: 28px; text-transform: uppercase; }
.head .meta { color: var(--muted); font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; }
.card h3 { font-size: 21px; line-height: 1.1; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.empty { background: var(--surface-2); border: 1.5px dashed var(--line); border-radius: 8px; padding: 16px; color: var(--muted); }
.tag { font: 700 11px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--gold-ink); }
.pill { display: inline-block; font: 700 12px var(--f-body); border-radius: 999px; padding: 2px 9px; background: var(--surface-2); color: var(--muted); }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.ko { background: var(--ko-bg); color: var(--ko); } .pill.warn { background: var(--warn-bg); color: var(--warn); } .pill.gold { background: color-mix(in srgb, var(--gold) 22%, var(--surface)); color: var(--gold-ink); }
.note { white-space: pre-wrap; margin: 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-weight: 600; font-size: 14px; }
.chip[aria-pressed="true"] { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 16%, var(--surface)); }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; font: 700 12px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }

/* Planning */
.planning { min-width: 760px; table-layout: fixed; }
.planning th:first-child, .planning td:first-child { width: 150px; }
.planning td { height: 64px; }
.planning td.today, .planning th.today { background: color-mix(in srgb, var(--gold) 9%, var(--surface)); }
.ev { display: block; width: 100%; text-align: left; border: 0; border-left: 4px solid var(--gold); background: var(--surface-2); border-radius: 4px; padding: 4px 6px; margin-bottom: 4px; font-size: 13px; line-height: 1.25; }
.ev b { display: block; font-weight: 700; }
.addcell { border: 1.5px dashed var(--line); background: transparent; color: var(--muted); border-radius: 4px; width: 100%; padding: 2px; font-size: 13px; }

/* Photos */
.zones { display: grid; gap: 12px; }
.zone { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.zone > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; font: 800 20px var(--f-display); text-transform: uppercase; }
.zone > summary::-webkit-details-marker { display: none; }
.zone > summary::after { content: "+"; font-size: 22px; color: var(--gold-ink); }
.zone[open] > summary::after { content: "−"; }
.phases { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; padding: 0 12px 12px; }
.phase { background: var(--surface-2); border-radius: 8px; padding: 10px; display: grid; gap: 8px; align-content: start; }
.phase h4 { margin: 0; font: 700 15px var(--f-display); letter-spacing: .06em; text-transform: uppercase; display: flex; justify-content: space-between; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; }
.thumb { aspect-ratio: 1; max-width: 100%; border: 0; padding: 0; border-radius: 6px; overflow: hidden; background: var(--line); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.upl { position: relative; overflow: hidden; }
.upl input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* Fiche */
fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 0; display: grid; gap: 10px; background: var(--surface); }
legend { font: 800 18px var(--f-display); text-transform: uppercase; padding: 0 6px; color: var(--gold-ink); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.cks { display: flex; gap: 14px; flex-wrap: wrap; font-weight: 600; font-size: 15px; }
.cks label { display: flex; gap: 6px; align-items: center; }
.cks input { width: 20px; height: 20px; accent-color: var(--brand); }
.perms td select { padding: 6px 8px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--surface-2); }

/* Modale */
.modal { position: fixed; inset: 0; background: rgba(20, 14, 8, .55); z-index: 50; display: grid; place-items: center; padding: 16px; }
.modal .box { background: var(--surface); border-radius: 12px; width: 100%; max-width: 560px; max-height: calc(100vh - 32px); overflow: auto; display: grid; gap: 12px; padding: 18px; }
.modal .box.wide { max-width: 860px; }
.modal h3 { font-size: 24px; text-transform: uppercase; }
.viewer img { width: 100%; height: auto; border-radius: 8px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 60; max-width: calc(100% - 32px); }
.ecole { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; }
.ecole-bar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.ecole-bar b { font: 800 20px var(--f-display); text-transform: uppercase; flex: 1; }
.ecole-body { flex: 1; min-height: 0; }
.ecole-body iframe { width: 100%; height: 100%; border: 0; display: block; }
.navbar { display: flex; align-items: center; gap: 8px; padding-block: 10px 0; }
.navbar .where { flex: 1; min-width: 0; text-align: center; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.navbar button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 14px; }
.navbar button:disabled { opacity: .35; cursor: default; }
.autosave { font-size: 13px; color: var(--muted); min-height: 1.2em; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.step .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 800 16px var(--f-display); background: var(--surface-2); border: 1.5px solid var(--line); color: var(--muted); }
.step.done .n { background: var(--ok); border-color: var(--ok); color: var(--surface); }
/* Onglets groupés, recherche */
nav.tabs .grp { flex: none; align-self: center; font: 700 10px var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--gold-ink); padding: 0 4px 0 12px; border-left: 1px solid var(--line); margin-left: 6px; }
mark { background: color-mix(in srgb, var(--gold) 35%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
header.bar form.qs { flex: 0 1 240px; min-width: 0; }
header.bar form.qs input { width: 100%; border: 1.5px solid color-mix(in srgb, var(--on-brand) 35%, transparent); background: color-mix(in srgb, var(--on-brand) 12%, transparent); color: var(--on-brand); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
header.bar form.qs input::placeholder { color: color-mix(in srgb, var(--on-brand) 70%, transparent); }
.raccs { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.racc { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; }
.racc .tag { margin-bottom: 2px; }
.racc button { text-align: left; border: 0; background: var(--surface-2); border-radius: 7px; padding: 8px 10px; font-weight: 600; }
.racc button:hover { background: color-mix(in srgb, var(--gold) 14%, var(--surface)); }
#clRes tr.tot td { background: var(--surface-2); }
@media (max-width: 720px) { header.bar .who { display: none; } }
@media (max-width: 560px) { header.bar .ttl { display: none; } header.bar form.qs { flex: 1 1 auto; } }
@media (max-width: 560px) { .step { grid-template-columns: auto 1fr; } .step .ctl { grid-column: 2; } header.bar .who span { display: none; } }
.xrsync { border-radius: 999px !important; font-size: 12px !important; white-space: nowrap; }
.xrsync.ok { border-color: color-mix(in srgb, #7fd3a0 70%, transparent) !important; }
.xrsync.warn { background: #f0b86033 !important; border-color: #f0b860 !important; }
.xrsync.ko { background: #ff8a7f33 !important; border-color: #ff8a7f !important; }
header.bar { padding-top: env(safe-area-inset-top); }
@media (max-width: 560px) { header.bar .inner { gap: 6px; } #logoutBtn { padding: 5px 7px !important; } }
</style>
</head>

function autoSave(form, o) {

    var d = formData(form);
    if (o.valide && !o.valide(d)) { dire('Complétez les champs obligatoires pour enregistrer.'); return file; }
    dire('Enregistrement…');

}

}

/* ---------- TVA et encaissements de la période ---------- */
function vueTva(factures, ops, P) {
  var ventes = factures.filter(function (f) { return f.sens === 'vente'; }), achats = factures.filter(function (f) { return f.sens === 'achat'; });
  var parTaux = function (liste, filtre) { var t = {}; liste.forEach(function (f) { if (!filtre(f)) return; (f.lignesTva || []).forEach(function (x) { var k = String(nb(x.taux)); t[k] = t[k] || { base: 0, tva: 0 }; t[k].base += nb(x.base); t[k].tva += nb(x.montant); }); }); return t; };
  var factPeriode = function (f) { return periodeOk(f.date, P); };
  var facturee = parTaux(ventes, factPeriode), deductible = parTaux(achats, factPeriode);
  // TVA comprise dans les encaissements de la période (règle des prestations de services : TVA due à l'encaissement)
  var encT = {}, encList = [];
  ventes.forEach(function (f) {
    var ttc = nb(f.ttc), tvaTot = tvaDe(f);
    var liste = (f.encaissements || []).slice();
    if (nb(f.cee) && f.ceeRecue) liste.push({ date: f.ceeRecue, montant: nb(f.cee), mode: 'Prime CEE (plateforme)', origine: 'cee' });
    liste.forEach(function (e) {
      if (!periodeOk(e.date, P)) return;
      encList.push({ date: e.date, f: f, e: e });
      if (!ttc || !tvaTot) return;
      (f.lignesTva || []).forEach(function (x) { var k = String(nb(x.taux)); encT[k] = encT[k] || { base: 0, tva: 0 }; var part = nb(e.montant) * nb(x.montant) / ttc; encT[k].tva += part; encT[k].base += part * 100 / (nb(x.taux) || 1); });
    });
  });
  encList.sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
  var tableTaux = function (t, titre) { var ks = Object.keys(t).sort(function (a, b) { return b - a; }); var tb = ks.reduce(function (s, k) { return s + t[k].base; }, 0), tv = ks.reduce(function (s, k) { return s + t[k].tva; }, 0); return '<div class="card"><span class="tag">' + titre + '</span>' + (ks.length ? '<table><thead><tr><th>Taux</th><th style="text-align:right">Base HT</th><th style="text-align:right">TVA</th></tr></thead><tbody>' + ks.map(function (k) { return '<tr><td>' + k.replace('.', ',') + ' %</td><td style="text-align:right">' + eur(t[k].base) + '</td><td style="text-align:right">' + eur(t[k].tva) + '</td></tr>'; }).join('') + '<tr><td><b>Total</b></td><td style="text-align:right"><b>' + eur(tb) + '</b></td><td style="text-align:right"><b>' + eur(tv) + '</b></td></tr></tbody></table>' : '<span class="muted small">Rien sur la période.</span>') + '</div>'; };
  var tvEnc = Object.keys(encT).reduce(function (s, k) { return s + encT[k].tva; }, 0), tvDed = Object.keys(deductible).reduce(function (s, k) { return s + deductible[k].tva; }, 0);
  var attente = ventes.filter(function (f) { return nb(f.reste) > 0.005; });
  var ceeAttente = ventes.filter(function (f) { return nb(f.cee) > 0 && !f.ceeRecue; });
  var h = '<p class="muted small" style="margin:0">Période : <b>' + esc(libPeriode(P)) + '</b>. Pour des travaux (prestations de services), la TVA est due à l\'encaissement : la TVA « encaissée » est calculée au prorata de chaque encaissement. Estimation à faire valider par votre comptable.</p>' +
    '<div class="grid">' + tableTaux(facturee, 'TVA facturée (factures de la période)') + tableTaux(encT, 'TVA comprise dans les encaissements') + tableTaux(deductible, 'TVA déductible (achats de la période)') + '</div>' +
    '<div class="card"><span class="tag">Estimation TVA à reverser sur la période</span><b style="font-size:24px">' + eur(tvEnc - tvDed) + '</b><span class="muted small">TVA encaissée ' + eur(tvEnc) + ' − TVA déductible ' + eur(tvDed) + '</span></div>' +
    '<div class="head" style="border-bottom-width:1px"><h2 style="font-size:20px">Encaissements de la période</h2><span class="meta">' + eur(encList.reduce(function (s, x) { return s + nb(x.e.montant); }, 0)) + '</span></div>' +
    (encList.length ? '<div class="tablewrap"><table><thead><tr><th>Date</th><th>Client</th><th>Facture</th><th>Mode</th><th style="text-align:right">Montant</th></tr></thead><tbody>' + encList.map(function (x) { return '<tr><td class="small">' + esc(dateFr(x.date)) + '</td><td>' + esc(x.f.tiers) + '</td><td class="small">' + esc(x.f.numero) + '</td><td class="small">' + esc(x.e.mode) + (x.e.origine === 'banque' ? ' · relevé' : '') + '</td><td style="text-align:right">' + eur(nb(x.e.montant)) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="empty">Aucun encaissement sur la période.</div>') +
    '<div class="head" style="border-bottom-width:1px"><h2 style="font-size:20px">En attente d\'encaissement</h2><span class="meta">' + eur(attente.reduce(function (s, f) { return s + nb(f.reste); }, 0)) + ' au total</span></div>' +
    (ceeAttente.length ? '<div class="card"><span class="tag">Primes CEE à recevoir de la plateforme</span><b>' + eur(ceeAttente.reduce(function (s, f) { return s + nb(f.cee); }, 0)) + '</b><span class="small">' + ceeAttente.map(function (f) { return esc(f.tiers + (f.numero ? ' (' + f.numero + ')' : '') + ' : ' + eur(nb(f.cee))); }).join(' · ') + '</span></div>' : '') +
    (attente.length ? '<div class="tablewrap"><table><thead><tr><th>Client</th><th>Facture</th><th>Date</th><th style="text-align:right">Net à payer</th><th style="text-align:right">Encaissé</th><th style="text-align:right">Reste</th></tr></thead><tbody>' + attente.map(function (f) { return '<tr><td>' + esc(f.tiers) + '</td><td class="small">' + esc(f.numero) + '</td><td class="small">' + esc(dateFr(f.date)) + '</td><td style="text-align:right">' + eur(netDe(f)) + '</td><td style="text-align:right">' + eur(encaisse(f)) + '</td><td style="text-align:right"><b>' + eur2(f.reste) + '</b></td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="empty">Tout est encaissé.</div>') +
    '<div class="row"><button class="btn ghost small" id="tvCsv">Exporter la synthèse TVA (CSV)</button></div>';
  $('faZone').innerHTML = h;
  $('tvCsv').onclick = function () {
    var lignes = [];
    [['TVA facturée', facturee], ['TVA encaissée', encT], ['TVA déductible', deductible]].forEach(function (g) { Object.keys(g[1]).sort(function (a, b) { return b - a; }).forEach(function (k) { lignes.push([libPeriode(P), g[0], nb(k), g[1][k].base, g[1][k].tva]); }); });
    lignes.push([libPeriode(P), 'Estimation TVA à reverser', '', '', tvEnc - tvDed]);
    telechargerCsv('tva-' + libPeriode(P).replace(/\s/g, '-') + '.csv', ['Période', 'Rubrique', 'Taux %', 'Base HT', 'TVA'], lignes);
  };
}

    '<div class="fgrid"><label class="f">Prénom<input name="prenom" required maxlength="60" value="' + esc(u.prenom) + '"></label><label class="f">Nom<input name="nom" maxlength="60" value="' + esc(u.nom) + '"></label></div>' +
    '<div class="fgrid"><label class="f">Identifiant de connexion<input name="identifiant" required maxlength="40" autocapitalize="none" value="' + esc(u.identifiant) + '" placeholder="ex. pierre.le-goff"></label><label class="f">Poste<input name="poste" maxlength="80" value="' + esc(u.poste) + '" placeholder="Poseur, chef de chantier…"></label></div>' +
    '<div class="fgrid"><label class="f">Téléphone<input name="telephone" maxlength="40" value="' + esc(u.telephone) + '"></label><label class="f">E-mail<input name="email" maxlength="120" value="' + esc(u.email) + '"></label></div>' +
    '<div class="fgrid"><label class="f">Rôle<select name="role" id="usRole">' + (superAdmin() ? ['superadmin', 'administratif', 'salarie', 'ouvrier'] : ['salarie', 'ouvrier']).map(function (r) { return '<option value="' + r + '"' + (r === u.role ? ' selected' : '') + '>' + ROLES[r] + (r === 'superadmin' ? ' (tous les droits)' : r === 'administratif' ? ' (bureau)' : '') + '</option>'; }).join('') + '</select></label><label class="f">Compte<select name="actif"><option value="oui">Actif</option><option value="non"' + (u.actif === 'non' ? ' selected' : '') + '>Désactivé</option></select></label></div>' +
    (nouveau ? '<label class="f">Mot de passe provisoire<input name="motDePasse" required minlength="8" placeholder="8 caractères, lettres et chiffres"></label><p class="muted small" style="margin:0">Le salarié devra le changer à sa première connexion.</p>' : '') +
    '<div class="tablewrap perms"><table><thead><tr><th>Onglet</th><th>Droit</th><th>Ce que ça permet</th></tr></thead><tbody>' + Object.keys(LIB_MOD).map(function (k) { var v = (u.perms || {})[k] || (PERMS_PAR_ROLE[u.role || 'salarie'] || {})[k] || 'aucun'; var opts = (k === 'planning' || k === 'accueil') ? [['lecture', 'Consultation'], ['modif', 'Modification']] : k === 'recherche' ? [['aucun', 'Aucun accès'], ['lecture', 'Accès']] : [['aucun', 'Aucun accès'], ['lecture', 'Consultation'], ['modif', 'Modification']]; if (k === 'recherche' && v === 'modif') v = 'lecture'; return '<tr><td>' + LIB_MOD[k][0] + '</td><td><select data-perm="' + k + '">' + opts.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === v ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></td><td class="small muted">Consultation : ' + LIB_MOD[k][1] + (LIB_MOD[k][2] !== '—' ? '<br>Modification : ' + LIB_MOD[k][2] : '') + '</td></tr>'; }).join('') + '</tbody></table></div><p class="muted small" style="margin:0">Changer le rôle remet les droits par défaut du rôle ; vous pouvez ensuite ajuster chaque ligne pour cette personne.</p>' +
    '<div class="err" id="usErr"></div><div class="row"><button class="btn primary">Enregistrer</button><button type="button" class="btn ghost" id="usX">Annuler</button></div></form>' +
    (nouveau ? '' : '<form class="card" id="rpF" style="margin-top:4px"><span class="tag">Réinitialiser le mot de passe</span><label class="f">Nouveau mot de passe provisoire<input name="mdp" required minlength="8"></label><div><button class="btn ghost">Réinitialiser</button></div></form>') +
    (!nouveau && superAdmin() && u.id !== S.user.id ? '<div class="card" style="border-color:var(--ko)"><span class="tag" style="color:var(--ko)">Supprimer le compte</span><p class="small" style="margin:0">Suppression définitive : la personne ne pourra plus se connecter et son parcours de formation est effacé. Son historique (planning, photos, chantiers) et ses documents RH dans le Drive sont conservés. Pour une absence temporaire, préférez « Compte : Désactivé ».</p><div><button type="button" class="btn danger" id="usDel">Supprimer ce compte</button></div></div>' : ''), true);
  var brU = nouveau ? brouillon($('usF'), 'compte', null) : null;
  $('usX').onclick = function () { m.fermer(); };
  // changer de rôle applique les droits par défaut de ce rôle (modifiables ensuite)
  $('usRole').onchange = function () { var p = PERMS_PAR_ROLE[$('usRole').value]; $('usF').querySelectorAll('[data-perm]').forEach(function (sel) { var v = p[sel.dataset.perm]; if (v === 'modif' && !sel.querySelector('option[value="modif"]')) v = 'lecture'; if (sel.querySelector('option[value="' + v + '"]')) sel.value = v; }); };
  $('usF').onsubmit = function (ev) {
    ev.preventDefault(); $('usErr').textContent = '';
    var d = formData($('usF')); d.perms = {}; $('usF').querySelectorAll('[data-perm]').forEach(function (s) { d.perms[s.dataset.perm] = s.value; }); if (u.id) d.id = u.id;
    call('saveUser', { user: d }).then(function (x) { if (brU) brU.effacer(); m.remove(); if (x.id === S.user.id) { S.user = Object.assign(S.user, x); } toast(nouveau ? 'Compte créé : communiquez l\'identifiant et le mot de passe provisoire.' : 'Compte enregistré.'); ouvrir('admin'); call('annuaire').then(function (a) { S.annuaire = a; }); })
      .catch(function (e) { $('usErr').textContent = e.message; });
  };
  if ($('usDel')) $('usDel').onclick = function () {
    var b = $('usDel');
    if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Confirmer : supprimer ' + (u.prenom + ' ' + u.nom).trim(); return; }
    b.disabled = true;
    call('deleteUser', { userId: u.id }).then(function () { m.remove(); toast('Compte supprimé.'); S.annuaire = S.annuaire.filter(function (x) { return x.id !== u.id; }); ouvrir('admin'); }).catch(function (e) { b.disabled = false; echec(e); });
  };
  if ($('rpF')) $('rpF').onsubmit = function (ev) { ev.preventDefault(); call('resetPassword', { userId: u.id, motDePasse: formData($('rpF')).mdp }).then(function () { toast('Mot de passe réinitialisé. Le salarié devra le changer.'); m.remove(); ouvrir('admin'); }).catch(echec); };
}

/* ===================== DÉMARRAGE ===================== */
(function () {
  var t = stockage('xr_token');
  if (!t) { afficher('login'); return; }
  S.token = t;
  call('me').then(function (u) { S.user = u; demarrer(); }).catch(function () { if (!S.user) afficher(S.token ? 'login' : 'login'); });
})();
</script>
